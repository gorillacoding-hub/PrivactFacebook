name: Build PrivacyFBLite APK

on:
  workflow_dispatch:
    inputs:
      facebook_lite_apk_url:
        description: Direct HTTPS URL to an untouched Facebook Lite APK
        required: true
        type: string

      publish_release:
        description: Publish the patched APK as a GitHub Release
        required: true
        type: boolean
        default: false

      distribution_authorized:
        description: Confirm legal authorization for public distribution
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: read

concurrency:
  group: privacyfblite-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build PrivacyFBLite
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      APK_URL: ${{ inputs.facebook_lite_apk_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate APK URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          url = urlparse(os.environ["APK_URL"])

          if url.scheme != "https" or not url.netloc:
              raise SystemExit("A direct HTTPS APK URL is required.")

          if url.username or url.password:
              raise SystemExit("URL credentials are not permitted.")
          PY

      - name: Checkout Facebook Lite patches
        uses: actions/checkout@v4
        with:
          repository: BlazeFTL/FaceBook-Lite-Morphe
          ref: dev
          path: patch-source

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build Facebook Lite patches
        working-directory: patch-source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./gradlew

          ./gradlew --no-daemon --stacktrace buildAndroid

          MPP="$(find patches/build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.mpp' \
            -print -quit)"

          if [ -z "$MPP" ]; then
            echo "::error::No patch bundle generated."
            exit 1
          fi

          echo "PATCH_BUNDLE=$GITHUB_WORKSPACE/patch-source/$MPP" >> "$GITHUB_ENV"

      - name: Download Facebook Lite APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$RUNNER_TEMP/facebook-lite.apk"

          curl --fail --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 1800 \
            --max-filesize 1000000000 \
            "$APK_URL" \
            --output "$APK"

          test -s "$APK"
          unzip -tqq "$APK"

          PACKAGE="$ANDROID_HOME/build-tools/35.0.0/aapt"

          PACKAGE_NAME="$("$PACKAGE" dump badging "$APK" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p" |
            head -n1)"

          if [ "$PACKAGE_NAME" != "com.facebook.lite" ]; then
            echo "::error::Wrong APK package: $PACKAGE_NAME"
            exit 1
          fi

          echo "APK_INPUT=$APK" >> "$GITHUB_ENV"

      - name: Download and verify Morphe CLI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p tools

          CLI="tools/morphe-desktop-1.11.0-all.jar"

          URL="https://github.com/MorpheApp/morphe-desktop/releases/download/v1.11.0/morphe-desktop-1.11.0-all.jar"

          EXPECTED="85c222421f07bb67098d191b9870323199fea871ddab53fcd6de915ca70e5fe6"

          curl --fail --location \
            --retry 3 \
            --retry-all-errors \
            "$URL" \
            --output "$CLI"

          printf '%s  %s\n' "$EXPECTED" "$CLI" |
            sha256sum --check -

          java -jar "$CLI" --version

          echo "MORPHE_CLI=$GITHUB_WORKSPACE/$CLI" >> "$GITHUB_ENV"

      - name: Apply Facebook Lite patches
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$GITHUB_WORKSPACE/PrivacyFBLite.apk"
          REPORT="$GITHUB_WORKSPACE/patch-report.json"

          java -Xmx6g -jar "$MORPHE_CLI" patch \
            -p "$PATCH_BUNDLE" \
            -o "$OUTPUT" \
            -r "$REPORT" \
            "$APK_INPUT"

          test -s "$OUTPUT"

          sha256sum "$OUTPUT" > SHA256SUMS.txt

          ls -lh "$OUTPUT"
          cat SHA256SUMS.txt

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyFBLite
          path: |
            PrivacyFBLite.apk
            SHA256SUMS.txt
            patch-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify distribution authorization
        if: inputs.publish_release
        shell: bash
        run: |
          if [ "${{ inputs.distribution_authorized }}" != "true" ]; then
            echo "::error::Public distribution was not authorized."
            exit 1
          fi

      - name: Publish GitHub Release
        if: inputs.publish_release && inputs.distribution_authorized
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="privacyfblite-build-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            PrivacyFBLite.apk \
            SHA256SUMS.txt \
            patch-report.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "PrivacyFBLite Build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated Facebook Lite patch build. Verify SHA256SUMS.txt before installation."
